# ============================================================
# Employee Management System - Spring Boot Configuration
# ============================================================

# ------------------------------------------------------------
# Server Configuration
# ------------------------------------------------------------
server.port=${PORT:8081}
server.servlet.context-path=/

# ------------------------------------------------------------
# PostgreSQL Database Configuration
# ------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/employee_management_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ------------------------------------------------------------
# JWT Security Configuration
# ------------------------------------------------------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.ems=INFO